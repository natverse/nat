# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})${{ matrix.config.natcpp == 'false' && ' no natcpp' || '' }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,    r: 'release'}
          - {os: windows-latest,  r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest, r: 'release', codecov: 'true'}
          - {os: ubuntu-latest, r: 'oldrel-1'}
          # natcpp is only in Enhances; check the pure R fallback paths
          - {os: ubuntu-latest, r: 'release', natcpp: 'false'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      RGL_USE_NULL: true

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          # Public RSPM (Posit Package Manager) binaries only on Linux, where
          # they are the big win. macOS/Windows fall back to CRAN binaries:
          # P3M's macOS arm64 Rvcg build currently fails to load with a missing
          # libomp symbol (___kmpc_dispatch_init_4u), and CRAN's build is clean.
          use-public-rspm: ${{ startsWith(matrix.config.os, 'ubuntu') }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, natverse/natcpp
          needs: check

      - name: Remove natcpp (Enhances) to test fallback paths
        if: ${{ matrix.config.natcpp == 'false' }}
        run: |
          Rscript -e 'remove.packages("natcpp", lib=dirname(find.package("natcpp")))'
          Rscript -e 'stopifnot(!requireNamespace("natcpp", quietly=TRUE))'

      - name: Build CMTK
        if: ${{matrix.config.os == 'macos-latest'}}
        run: sh ./build-cmtk.sh
        env:
          CC: clang
          CXX: clang++
          MAKEFLAGS: "-j2"

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
